name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build wheel
        run: python -m build
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: soma-wheel
          path: dist/

  validate:
    needs: build-wheel
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: soma-wheel
          path: dist/
      
      - name: Install test dependencies
        run: pip install dist/*.whl ".[dev]" pyyaml

      - name: Run validation
        run: make validate
      
      - name: Run test suite
        id: test
        run: make test

      - name: Soma CI Outcome Report
        if: always()
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_REF" ]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only "$BASE_REF...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$CHANGED" ]; then
            python3 enzymes/ci_outcome_reporter.py \
              --changed-files "$CHANGED" \
              --test-result "${{ steps.test.outcome }}" \
              --commit-sha "${{ github.sha }}" \
              --format markdown >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify README claims
        run: python enzymes/verify_readme_claims.py

      - name: Verify Bug Registry
        run: python3 enzymes/verify_bug_registry.py

      - name: Check for hardcoded paths
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' enzymes/ genome/ organs/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"
      
      - name: Verify script counts
        run: |
          SCRIPT_COUNT=$(ls enzymes/*.py enzymes/*.sh | wc -l)
          echo "Scripts found: $SCRIPT_COUNT"
          if [ "$SCRIPT_COUNT" -lt 16 ]; then
            echo "ERROR: Expected at least 16 scripts in enzymes/"
            exit 1
          fi
      
      - name: Verify privacy invariant
        run: |
          if grep -rn 'os\.getenv\|os\.environ\|subprocess\.check_output.*which' enzymes/*.py 2>/dev/null | grep -v 'METRICS_REPO\|TEAM_REPO\|ORG_REPO\|TEAM_MEMBER_ID\|SOMA_PLATFORM\|GEMINI_API_KEY\|RULES_SUBSET\|ENABLE_HOOKS\|GIT_STRATEGY\|TEAM_SIZE\|APPROVAL_CHAIN\|CONVERSATION_LOG_DIR\|GENESIS_REPORT_DIR'; then
            echo "WARNING: Potential privacy invariant violation - unexpected env var access"
          fi
          echo "Privacy check complete"

      - name: Dry-run install (all platforms)
        run: |
          for platform in gemini kiro copilot claude mcp; do
            echo "=== $platform ==="
            bash install/install.sh "$platform" --dry-run || exit 1
          done

      - name: Dry-run uninstall
        run: bash install/uninstall.sh gemini --dry-run --force

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install/install.ps1", [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parsed successfully"

      - name: Parse PowerShell uninstaller
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install/uninstall.ps1", [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "uninstall.ps1 parsed successfully"

      - name: Dry-run PowerShell install
        shell: pwsh
        run: |
          $result = & pwsh -File install/install.ps1 -DryRun 2>&1
          Write-Host $result
          if ($result -match 'Installed 0 rules') {
            Write-Error "PowerShell dry-run reported 0 rules — SOMA-C11 regression"
            exit 1
          }

      # `.\install.ps1` on stock Windows runs Windows PowerShell 5.1, which reads
      # BOM-less scripts as cp1252; pwsh 7 defaults to UTF-8 and hides that (BUG-011).
      - name: Dry-run under Windows PowerShell 5.1
        shell: powershell
        run: |
          $result = & powershell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -DryRun 2>&1 | Out-String
          Write-Host $result
          if ($result -notmatch 'Dry-run complete') {
            Write-Error "install.ps1 dry-run failed under Windows PowerShell 5.1 - BUG-011 regression"
            exit 1
          }
