[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-steering"
version = "0.31.0"
description = "Adaptive governance framework for AI coding assistants"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Soma Contributors"}
]
keywords = [
    "ai-governance", "agent-alignment", "evolutionary-rules",
    "code-review", "ai-coding-assistant", "token-optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
soma = "enzymes.soma_cli:main"
soma-mcp = "soma_mcp.server:main"

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/nseney1/soma"
Documentation = "https://github.com/nseney1/soma/tree/main/docs"
Changelog = "https://github.com/nseney1/soma/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["soma_sdk*", "enzymes*", "soma_mcp*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
soma_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
